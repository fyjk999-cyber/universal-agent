<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Agent · 可视化看板</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#2d333b;
    --text:#e6edf3; --muted:#8b949e; --accent:#3fb950; --warn:#d29922;
    --danger:#f85149; --blue:#58a6ff; --purple:#bc8cff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:20px; }
  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    margin-bottom:16px; }
  h1 { font-size:20px; font-weight:700; }
  .sub { color:var(--muted); font-size:12px; }
  .pill { padding:4px 12px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.ok { background:rgba(63,185,80,.15); color:var(--accent); border:1px solid var(--accent); }
  .pill.bad { background:rgba(248,81,73,.15); color:var(--danger); border:1px solid var(--danger); }
  .pill.warn { background:rgba(210,153,34,.15); color:var(--warn); border:1px solid var(--warn); }
  .flow { display:flex; gap:4px; flex-wrap:wrap; align-items:center;
    padding:10px 12px; background:var(--panel); border:1px solid var(--border);
    border-radius:8px; margin-bottom:16px; font-size:11px; color:var(--muted); }
  .flow .step { padding:3px 8px; border-radius:5px; background:var(--panel2);
    border:1px solid var(--border); color:var(--blue); }
  .flow .step.done { color:var(--accent); border-color:var(--accent); }
  .flow .arrow { color:var(--muted); }
  .grid { display:grid; grid-template-columns: 1fr 380px; gap:16px; }
  @media (max-width: 1100px) { .grid { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:16px; margin-bottom:16px; }
  .panel h2 { font-size:14px; margin-bottom:12px; color:var(--muted);
    display:flex; justify-content:space-between; align-items:center; }
  .panel h2 .tag { font-size:11px; font-weight:400; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:500; font-size:11px;
    padding:6px 8px; border-bottom:1px solid var(--border); }
  td { padding:8px; border-bottom:1px solid rgba(45,51,59,.5); }
  tr:hover td { background:var(--panel2); }
  .scorebar { height:6px; background:var(--panel2); border-radius:3px;
    overflow:hidden; min-width:70px; }
  .scorebar > i { display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--accent)); }
  .avail { font-weight:600; }
  .avail.yes { color:var(--accent); }
  .avail.no { color:var(--danger); }
  .opp { background:linear-gradient(135deg,rgba(63,185,80,.12),rgba(88,166,255,.08));
    border:1px solid var(--accent); border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  .opp h3 { color:var(--accent); font-size:15px; margin-bottom:6px; }
  .opp .detail { font-size:13px; color:var(--text); line-height:1.7; }
  .src { display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; border:1px solid var(--border); border-radius:8px;
    margin-bottom:8px; background:var(--panel2); }
  .src .name { font-weight:600; font-size:13px; }
  .src .reason { color:var(--muted); font-size:11px; margin-top:2px; }
  .evt { font-size:11px; color:var(--muted); padding:3px 0; border-bottom:1px dashed var(--border); }
  .evt b { color:var(--blue); }
  .empty { color:var(--muted); font-size:13px; padding:12px 0; }
  .foot { color:var(--muted); font-size:11px; margin-top:16px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Universal Persistent Watch &amp; Decision</h1>
  <span class="sub">Universal Agent 可视化看板 · Railway(12306) 真实数据</span>
  <span id="healthPill" class="pill warn">检测中…</span>
  <button id="refreshBtn" onclick="doRefresh()" style="margin-left:auto;
    background:var(--panel2); color:var(--text); border:1px solid var(--blue);
    border-radius:6px; padding:6px 16px; cursor:pointer; font-size:13px;">⟳ 刷新</button>
  <span id="countdown" class="sub"></span>
</header>

<div class="panel" style="padding:12px 16px;">
  <h2>📍 切换查询（起止站 / 日期）</h2>
  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <input id="qFrom" list="stations" placeholder="出发站（如 上海）" style="padding:8px 12px; border-radius:6px; border:1px solid var(--border); background:var(--panel2); color:var(--text);">
    <span style="color:var(--muted)">→</span>
    <input id="qTo" list="stations" placeholder="到达站（如 杭州东）" style="padding:8px 12px; border-radius:6px; border:1px solid var(--border); background:var(--panel2); color:var(--text);">
    <input id="qDate" type="date" style="padding:8px 12px; border-radius:6px; border:1px solid var(--border); background:var(--panel2); color:var(--text);">
    <button onclick="switchQuery()" style="background:var(--blue); color:#0d1117;
      border:none; border-radius:6px; padding:8px 20px; cursor:pointer; font-weight:700;">查询</button>
    <button onclick="favCurrent()" style="background:var(--panel2); color:var(--text);
      border:1px solid var(--purple); border-radius:6px; padding:8px 14px; cursor:pointer;">☆ 收藏此线路</button>
    <datalist id="stations"></datalist>
  </div>
  <div id="favBar" style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;"></div>
</div>

<div id="compare" style="display:none;"></div>

<div id="flow" class="flow"></div>

<div class="grid">
  <div>
    <div id="oppPanel"></div>

    <div class="panel">
      <h2>🚆 Railway 实时余票 <span id="railMeta" class="tag"></span></h2>
      <div id="railTable"></div>
    </div>

    <div class="panel">
      <h2>📈 余票/得分趋势 <span id="histMeta" class="tag"></span></h2>
      <canvas id="histChart" height="170" style="width:100%;"></canvas>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;">
        每次扫描记录一条历史点；绿点=该座别有票，红点=售罄。上方为 Top 车次。
      </div>
    </div>

    <div class="panel">
      <h2>⚙️ 事件流（本次 Scan 触发的事件）</h2>
      <div id="events"></div>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2>🔌 数据源状态</h2>
      <div id="sources"></div>
    </div>
    <div class="panel">
      <h2>🧠 SPAC 工作循环</h2>
      <div id="cycle"></div>
    </div>
  </div>
</div>

<div class="foot">Universal Agent · SPAC.md 驱动 · 数据来自 12306 公开接口（无 key）· 刷新间隔 60s</div>

<script>
const $ = id => document.getElementById(id);
let railEvents = [];

async function getJSON(url) {
  const r = await fetch(url, {cache:'no-store'});
  return r.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function availClass(v) {
  v = String(v || '').trim();
  if (v === '' || v === '无' || v === '0') return 'no';
  return 'yes';
}

function renderFlow(rail) {
  const steps = rail && rail.events && rail.events.length
    ? rail.events.map(e => `<span class="step done">${esc(e)}</span>`)
    : ['SCAN_REQUESTED','RAW_LISTING_DISCOVERED','CANDIDATE_CREATED',
       'QUOTE_OBSERVED','SCORE_UPDATED','VERIFICATION_COMPLETED',
       'OPPORTUNITY_DETECTED','NOTIFICATION_REQUESTED','NOTIFICATION_SENT',
       'SCAN_COMPLETED'].map(s => `<span class="step">${s}</span>`);
  $('flow').innerHTML = steps.join('<span class="arrow">→</span>');
}

function renderHealth(h) {
  const p = $('healthPill');
  if (!h || h.healthy === undefined) { p.className='pill warn'; p.textContent='检测中…'; return; }
  p.className = 'pill ' + (h.healthy ? 'ok' : 'bad');
  p.textContent = h.healthy ? '● 健康' : '● 异常';
}

function renderRailway(d) {
  if (!d || !d.ranked) { $('railTable').innerHTML = '<div class="empty">加载中…</div>'; return; }
  $('railMeta').textContent =
    `raw=${d.raw_count} candidates=${d.candidate_count} · ${esc(d.query.from)}→${esc(d.query.to)} ${esc(d.query.date)}`;

  if (d.opportunity) {
    const o = d.opportunity;
    $('oppPanel').innerHTML = `<div class="opp">
      <h3>🎯 机会检测</h3>
      <div class="detail">
        <b>${esc(o.train_no)}</b> ${esc(o.route)} · ${esc(o.depart)}
        · ${esc(o.seat_class)} 余票=<b>${esc(o.available)}</b>
        · 得分 <b>${Math.round(o.score)}</b>
        <br>通知：<b>${d.notified ? '✅ 已投递' : '未投递'}</b>
        · 验证：<b>${d.verification ? esc(d.verification.status) : '-'}</b>
      </div></div>`;
  } else {
    $('oppPanel').innerHTML = '<div class="panel"><h2>🎯 机会</h2><div class="empty">当前无满足条件的机会（或全部售罄）</div></div>';
  }

  const rows = d.ranked.map((s, i) => {
    const a = availClass(s.available);
    const label = s.available_label ? esc(s.available_label) : (esc(s.available) || '—');
    const price = s.price && typeof s.price === 'object'
      ? esc(JSON.stringify(s.price)) : '—';
    return `<tr>
      <td>${i+1}</td>
      <td><b>${esc(s.train_no)}</b></td>
      <td>${esc(s.depart)} → ${esc(s.arrive)}</td>
      <td>${esc(s.seat_class)}</td>
      <td class="avail ${a}" title="${a === 'yes' ? '该座别可预订' : '售罄或不可订'}">${label}</td>
      <td title="12306 票价接口匿名受限时显示 —">${price}</td>
      <td><div class="scorebar"><i style="width:${Math.min(100,s.score)}%"></i></div></td>
      <td><b>${s.score}</b></td>
    </tr>`;
  }).join('');
  $('railTable').innerHTML = rows
    ? `<table><thead><tr><th>#</th><th>车次</th><th>时刻</th><th>座别</th><th>余票</th><th>票价</th><th>得分</th><th></th></tr></thead><tbody>${rows}</tbody></table>
       <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6">
       余票说明：<b>余N张</b>=实时余票数 · <b>有票</b>=充足 · <b>无票</b>=售罄 ·
       <b>有票(H3/B4/K2)</b>=12306 座别票额码（首字母为票类标记，非余票数，表示该座别有票）<br>
       票价说明：<b>—</b>=12306 匿名票价接口受限（返回"系统忙"）；接入登录态/商业接口后显示实时票价
       </div>`
    : '<div class="empty">暂无数据（12306 限流或不可达）</div>';

  if (d.events && d.events.length) {
    $('events').innerHTML = d.events.map(e =>
      `<div class="evt">▶ <b>${esc(e)}</b></div>`).join('');
  }
  renderFlow(d);
}

function renderSources(s) {
  if (!s || !s.sources) return;
  $('sources').innerHTML = Object.entries(s.sources).map(([id, h]) => {
    const cls = h.status === 'HEALTHY' ? 'ok' : (h.status === 'DEGRADED' || h.status === 'AUTH_REQUIRED' ? 'warn' : 'bad');
    return `<div class="src">
      <div><div class="name">${esc(id)}</div>
      <div class="reason">${esc(h.reason || h.status)}</div></div>
      <span class="pill ${cls}">${esc(h.status)}</span>
    </div>`;
  }).join('');
}

function renderCycle(cycle) {
  if (!cycle) return;
  $('cycle').innerHTML = cycle.map(s =>
    `<span class="step">${esc(s)}</span>`).join('<span class="arrow">→</span>');
}

let t = 60;
let currentQuery = {};
let routes = JSON.parse(localStorage.getItem('ua_routes') || '[]');

async function loadStations() {
  try {
    const s = await getJSON('/api/stations');
    $('stations').innerHTML = (s.stations || []).map(x =>
      `<option value="${esc(x)}">`).join('');
  } catch (e) { /* 忽略 */ }
}

function routeKey(r) { return `${r.from}|${r.to}|${r.date}`; }

function saveRoutes() {
  localStorage.setItem('ua_routes', JSON.stringify(routes));
  renderFavs();
}

function renderFavs() {
  $('favBar').innerHTML = (routes.length
    ? routes.map(r => `<span style="display:inline-flex;gap:6px;align-items:center;
        background:var(--panel2);border:1px solid var(--border);border-radius:999px;
        padding:4px 12px;font-size:12px;cursor:pointer;" onclick="loadRoute('${routeKey(r)}')"
        title="点击查看">
        ${esc(r.from)} → ${esc(r.to)} <span style="color:var(--muted)">${esc(r.date)}</span>
        <span onclick="event.stopPropagation();removeRoute('${routeKey(r)}')"
          style="color:var(--danger);cursor:pointer;font-weight:700;">×</span>
      </span>`).join('')
    : '<span class="sub">还没有收藏线路，点"☆ 收藏此线路"加入对比</span>');
  $('favBar').insertAdjacentHTML('beforeend',
    `<button onclick="compareRoutes()" style="background:var(--purple);color:#0d1117;
      border:none;border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:700;font-size:12px;">⇄ 对比查看</button>`);
}

function favCurrent() {
  const q = {from: $('qFrom').value.trim(), to: $('qTo').value.trim(),
             date: $('qDate').value};
  if (!q.from || !q.to || !q.date) { alert('请先填写线路'); return; }
  if (!routes.some(r => routeKey(r) === routeKey(q))) routes.push(q);
  saveRoutes();
}

function loadRoute(key) {
  const r = routes.find(x => routeKey(x) === key);
  if (!r) return;
  $('qFrom').value = r.from; $('qTo').value = r.to; $('qDate').value = r.date;
  currentQuery = {...r};
  $('compare').style.display = 'none';
  $('countdown').textContent = '查询中…';
  const qs = new URLSearchParams({...r, refresh: '1'}).toString();
  getJSON('/api/railway?' + qs).then(rail => { renderRailway(rail); t = 60; });
}

function removeRoute(key) {
  routes = routes.filter(r => routeKey(r) !== key);
  saveRoutes();
}

async function compareRoutes() {
  if (!routes.length) return;
  $('compare').style.display = 'block';
  $('compare').innerHTML = '<div class="empty">对比加载中…</div>';
  const cards = [];
  for (const r of routes) {
    try {
      const d = await getJSON('/api/railway?' +
        new URLSearchParams({...r, refresh: '1'}).toString());
      const rows = (d.ranked || []).slice(0, 3).map(s =>
        `<tr><td><b>${esc(s.train_no)}</b></td><td>${esc(s.depart)}→${esc(s.arrive)}</td>
         <td>${esc(s.seat_class)}</td>
         <td class="avail ${availClass(s.available)}">${esc(s.available_label || s.available)}</td>
         <td><b>${s.score}</b></td></tr>`).join('');
      const opp = d.opportunity
        ? `<div style="color:var(--accent);font-size:12px;margin-top:6px;">🎯 ${esc(d.opportunity.train_no)} ${esc(d.opportunity.seat_class)} 余票 ${esc(d.opportunity.available)}</div>` : '';
      cards.push(`<div class="panel" style="margin-bottom:0;">
        <h2>${esc(r.from)} → ${esc(r.to)} <span class="tag">${esc(r.date)} · ${d.raw_count} raw</span></h2>
        <table><thead><tr><th>车次</th><th>时刻</th><th>座别</th><th>余票</th><th>得分</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" class="empty">无数据</td></tr>'}</tbody></table>${opp}</div>`);
    } catch (e) {
      cards.push(`<div class="panel">${esc(r.from)} → ${esc(r.to)} <span class="sub">查询失败</span></div>`);
    }
  }
  $('compare').innerHTML =
    `<div class="panel" style="background:transparent;border-color:var(--purple);">
      <h2>⇄ 多线路对比 <span class="tag">Top3 / 线路</span></h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;">
      ${cards.join('')}</div></div>`;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

async function renderHistory() {
  try {
    const qs = new URLSearchParams(currentQuery).toString();
    const h = await getJSON('/api/railway/history?' + qs);
    const pts = h.history || [];
    $('histMeta').textContent = pts.length ? `${pts.length} 个采样点` : '';
    const cv = $('histChart');
    const ctx = cv.getContext('2d');
    const W = cv.width = cv.clientWidth || 800;
    const H = cv.height = 170;
    ctx.clearRect(0, 0, W, H);
    if (!pts.length) {
      ctx.fillStyle = '#8b949e'; ctx.font = '13px sans-serif';
      ctx.fillText('暂无历史数据（扫描后自动记录）', 12, H/2);
      return;
    }
    // 按 (车次, 座别) 聚合成多系列，选前 3 条画线
    const series = {};
    for (const p of pts) {
      const k = `${p.train_no} ${p.seat_class}`;
      (series[k] = series[k] || []).push(p);
    }
    const keys = Object.keys(series).slice(0, 3);
    const colors = ['#58a6ff', '#3fb950', '#bc8cff'];
    const maxN = Math.max(...keys.map(k => series[k].length));
    keys.forEach((k, ki) => {
      const data = series[k];
      const col = colors[ki % colors.length];
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath();
      data.forEach((p, i) => {
        const x = 20 + (maxN > 1 ? i / (maxN - 1) : 0) * (W - 40);
        const y = H - 20 - (Math.min(100, p.score) / 100) * (H - 40);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      data.forEach((p, i) => {
        const x = 20 + (maxN > 1 ? i / (maxN - 1) : 0) * (W - 40);
        const y = H - 20 - (Math.min(100, p.score) / 100) * (H - 40);
        const avail = String(p.available || '').trim();
        const ok = !(avail === '' || avail === '无' || avail === '0');
        ctx.fillStyle = ok ? '#3fb950' : '#f85149';
        ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill();
      });
    });
    // 图例
    ctx.font = '11px sans-serif';
    keys.forEach((k, ki) => {
      ctx.fillStyle = colors[ki % colors.length];
      ctx.fillText(k, 12, 14 + ki * 16);
    });
  } catch (e) { /* 忽略 */ }
}

async function refresh() {
  try {
    const qs = new URLSearchParams(currentQuery).toString();
    const [health, rail, sources, pipe] = await Promise.all([
      getJSON('/api/health'), getJSON('/api/railway?' + qs),
      getJSON('/api/sources'), getJSON('/api/pipeline')]);
    renderHealth(health);
    renderRailway(rail);
    renderSources(sources);
    renderCycle(pipe.cycle);
    renderHistory();
    t = 60;
  } catch (e) {
    $('healthPill').className = 'pill bad';
    $('healthPill').textContent = '● 服务不可达';
  }
}

async function doRefresh() {
  const qs = new URLSearchParams({...currentQuery, refresh: '1'}).toString();
  try {
    const rail = await getJSON('/api/railway?' + qs);
    renderRailway(rail);
    t = 60;
  } catch (e) { /* 下次定时刷新兜底 */ }
}

async function switchQuery() {
  const from = $('qFrom').value.trim();
  const to = $('qTo').value.trim();
  const date = $('qDate').value;
  if (!from || !to || !date) { alert('请填写出发站 / 到达站 / 日期'); return; }
  currentQuery = {from, to, date};
  $('countdown').textContent = '查询中…';
  const qs = new URLSearchParams({...currentQuery, refresh: '1'}).toString();
  try {
    const rail = await getJSON('/api/railway?' + qs);
    renderRailway(rail);
    t = 60;
  } catch (e) {
    $('healthPill').className = 'pill bad';
    $('healthPill').textContent = '● 查询失败';
  }
}

// 初始化：默认日期 + 车站列表
(function init() {
  const d = new Date();
  d.setDate(d.getDate() + 15);  // 12306 预售期内
  $('qDate').value = d.toISOString().slice(0, 10);
  $('qFrom').value = '上海';
  $('qTo').value = '杭州东';
  currentQuery = {from: '上海', to: '杭州东', date: $('qDate').value};
  loadStations();
  renderFavs();
})();

setInterval(() => {
  t -= 1;
  $('countdown').textContent = t <= 0 ? '刷新中…' : `${t}s 后刷新`;
  if (t <= 0) refresh();
}, 1000);

refresh();
</script>
</body>
</html>
